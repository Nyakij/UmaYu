[package]
name = "umayu"
version = "0.7.1-beta"
edition = "2024"
description = "A desktop companion for an Uma Musume: Pretty Derby (Global) account: collection, career planner on the community meta, and a port of Moomoolator's race simulator"
license = "GPL-3.0-or-later"
repository = "https://github.com/Nyakij/UmaYu"
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["file", "image"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
# SQLite database access: reads game master.mdb and unencrypted manifests.
# "bundled" builds SQLite 3 from amalgamation via cc (zero external C dependencies, cross-platform).
rusqlite = { version = "0.33.0", features = ["bundled"] }
# CRIWARE audio decoding: parses ACB/AWB archives and decodes HCA streams to PCM.
# Pinned exact version for API stability.
cridecoder = "=0.3.0"
# Cross-platform audio I/O: WASAPI output on Windows, pure Rust standard backend.
cpal = "0.16.0"
# LZ4 decompression for UnityFS asset bundles (extracting music scores lyrics & part data).
lz4_flex = "0.11.3"
# Pure Rust texture decoding for Unity GPU textures (BC1-BC7, ASTC, ETC).
texture2ddecoder = "0.1.2"
# Native folder dialog picker for directory selection without blocking UI thread.
# MIT / Apache-2.0 dual license.
rfd = { version = "0.17.2", default-features = false }



[profile.release]
opt-level = 3
strip = true
